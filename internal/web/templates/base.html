<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · DumpKeeper</title>
<script>
try {
  if (localStorage.getItem("dk-theme") === "dark") document.documentElement.dataset.theme = "dark";
} catch {}
</script>
<link rel="stylesheet" href="{{asset "app.css"}}">
<script src="{{asset "htmx.min.js"}}" defer></script>
<script src="{{asset "dashboard.js"}}" defer></script>
</head>
<body{{if .CSRF}} class="has-sidebar"{{end}}>
{{if .CSRF}}
<aside class="sidebar" aria-label="Primary navigation">
  <a class="sidebar-brand" href="{{u "/"}}">
    <span class="sidebar-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 5 5.8v5.4c0 4.3 2.9 7.3 7 8.8 4.1-1.5 7-4.5 7-8.8V5.8L12 3Z"/><path d="M12 8.2v5.6"/><path d="m9.6 11.4 2.4 2.4 2.4-2.4"/></svg></span>
    <span class="sidebar-label">DumpKeeper</span>
  </a>
  <button class="mobile-nav-toggle" type="button" aria-controls="primary-navigation" aria-expanded="false" aria-label="Open navigation">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <nav id="primary-navigation">
    <a href="{{u "/"}}" aria-label="Dashboard" title="Dashboard" data-tour="nav-dashboard">
      <span class="sidebar-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 14 4-4 3 3 5-6"/></svg></span><span class="sidebar-label">Dashboard</span>
    </a>
    <a href="{{u "/databases"}}" aria-label="Databases" title="Databases" data-tour="nav-databases">
      <span class="sidebar-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="5" rx="7" ry="3"/><path d="M5 5v7c0 4 14 4 14 0V5M5 12v7c0 4 14 4 14 0v-7"/></svg></span><span class="sidebar-label">Databases</span>
    </a>
    <a href="{{u "/destinations"}}" aria-label="Destinations" title="Destinations" data-tour="nav-destinations">
      <span class="sidebar-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m3 7 9-4 9 4-9 4-9-4Z"/><path d="m3 7 9 4 9-4v10l-9 4-9-4V7Z"/><path d="M12 11v10"/></svg></span><span class="sidebar-label">Destinations</span>
    </a>
    <a href="{{u "/jobs"}}" aria-label="Jobs" title="Jobs" data-tour="nav-jobs">
      <span class="sidebar-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6h10M9 12h10M9 18h10"/><path d="m4 6 1 1 2-2m-3 7 1 1 2-2m-3 7 1 1 2-2"/></svg></span><span class="sidebar-label">Jobs</span>
    </a>
    <a href="{{u "/executions"}}" aria-label="Executions" title="Executions" data-tour="nav-executions">
      <span class="sidebar-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg></span><span class="sidebar-label">Executions</span>
    </a>
    <a href="{{u "/restore"}}" aria-label="Restore" title="Restore" data-tour="nav-restore">
      <span class="sidebar-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"/><path d="m7 9 5-5 5 5"/><path d="M5 15v4a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-4"/></svg></span><span class="sidebar-label">Restore</span>
    </a>
    <a href="{{u "/availability"}}" aria-label="Availability" title="Availability">
      <span class="sidebar-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></span><span class="sidebar-label">Availability</span>
    </a>
    <a href="{{u "/settings"}}" aria-label="Settings" title="Settings">
      <span class="sidebar-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></span><span class="sidebar-label">Settings</span>
    </a>
  </nav>
  <div class="sidebar-footer">
    <button class="sidebar-control" type="button" data-open-guide data-tour="guide-button" aria-haspopup="dialog">
      <span class="sidebar-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.2 9.2a2.8 2.8 0 1 1 4 2.5c-.9.5-1.2 1-1.2 1.9"/><path d="M12 17h.01"/></svg></span>
      <span class="sidebar-label">Guide</span>
    </button>
    <button class="sidebar-control theme-toggle" type="button" aria-pressed="false">
      <span class="sidebar-icon theme-icon" aria-hidden="true">
        <svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
        <svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </span>
      <span class="sidebar-label theme-toggle-label">Dark theme</span>
    </button>
    <button class="sidebar-control sidebar-toggle" type="button" aria-expanded="true">
      <span class="sidebar-icon sidebar-toggle-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></span>
      <span class="sidebar-label sidebar-toggle-label">Collapse</span>
    </button>
    <form method="post" action="{{u "/logout"}}">
      <input type="hidden" name="csrf" value="{{.CSRF}}">
      <button class="sidebar-control sidebar-logout" type="submit" aria-label="Log out">
        <span class="sidebar-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 17l5-5-5-5M15 12H3M21 19V5a2 2 0 0 0-2-2h-6"/></svg></span>
        <span class="sidebar-label">Log out</span>
      </button>
    </form>
  </div>
</aside>
{{end}}
<div class="app-shell">
{{with .Msg}}<div class="flash flash-ok">{{.}}</div>{{end}}
{{with .Err}}<div class="flash flash-err">{{.}}</div>{{end}}
<main class="container">
{{template "content" .}}
</main>
</div>
{{if .CSRF}}
<dialog id="modal" class="modal">
  <div id="modal-body"></div>
  <button type="button" class="modal-close" data-modal-close aria-label="Close">&times;</button>
</dialog>
{{end}}
{{if .CSRF}}
<div id="product-tour" class="product-tour" data-csrf="{{.CSRF}}" data-dismiss-url="{{u "/onboarding/dismiss"}}" data-auto-start="{{if .ShowOnboarding}}1{{end}}" hidden>
  <div class="tour-focus" aria-hidden="true"></div>
  <div class="tour-guard" aria-hidden="true"></div>
  <section class="tour-popover" role="dialog" aria-modal="true" aria-labelledby="tour-title" aria-describedby="tour-copy">
    <div class="tour-progress"><span data-tour-progress></span><button type="button" class="tour-close" data-tour-stop aria-label="Skip guide">&times;</button></div>
    <h2 id="tour-title" data-tour-title></h2>
    <p id="tour-copy" data-tour-copy></p>
    <div class="tour-actions">
      <button type="button" class="btn" data-tour-stop>Skip tour</button>
      <span class="tour-nav">
        <button type="button" class="btn" data-tour-prev>&#8249; Back</button>
        <button type="button" class="btn btn-primary" data-tour-next>Next &#8250;</button>
      </span>
    </div>
  </section>
</div>
{{end}}
{{if .CSRF}}<script>
(() => {
  const body = document.body;
  const root = document.documentElement;
  const sidebarToggle = document.querySelector(".sidebar-toggle");
  const mobileNavToggle = document.querySelector(".mobile-nav-toggle");
  const themeToggle = document.querySelector(".theme-toggle");

  if (sidebarToggle) {
    const label = sidebarToggle.querySelector(".sidebar-toggle-label");
    const setCollapsed = (collapsed) => {
      body.classList.toggle("sidebar-collapsed", collapsed);
      sidebarToggle.setAttribute("aria-expanded", String(!collapsed));
      sidebarToggle.setAttribute("aria-label", collapsed ? "Expand sidebar" : "Collapse sidebar");
      label.textContent = collapsed ? "Expand" : "Collapse";
    };
    try {
      setCollapsed(localStorage.getItem("dk-sidebar-collapsed") === "1");
    } catch {
      setCollapsed(false);
    }
    sidebarToggle.addEventListener("click", () => {
      const collapsed = !body.classList.contains("sidebar-collapsed");
      setCollapsed(collapsed);
      try {
        localStorage.setItem("dk-sidebar-collapsed", collapsed ? "1" : "0");
      } catch {}
    });
  }

  if (mobileNavToggle) {
    const setMobileNavOpen = (open) => {
      body.classList.toggle("mobile-nav-open", open);
      mobileNavToggle.setAttribute("aria-expanded", String(open));
      mobileNavToggle.setAttribute("aria-label", open ? "Close navigation" : "Open navigation");
    };
    mobileNavToggle.addEventListener("click", () => {
      setMobileNavOpen(!body.classList.contains("mobile-nav-open"));
    });
    document.querySelector(".sidebar nav")?.addEventListener("click", (event) => {
      if (event.target.closest("a")) setMobileNavOpen(false);
    });
  }

  if (themeToggle) {
    const label = themeToggle.querySelector(".theme-toggle-label");
    const setTheme = (dark) => {
      root.dataset.theme = dark ? "dark" : "";
      themeToggle.setAttribute("aria-pressed", String(dark));
      themeToggle.setAttribute("aria-label", dark ? "Use light theme" : "Use dark theme");
      label.textContent = dark ? "Light theme" : "Dark theme";
    };
    setTheme(root.dataset.theme === "dark");
    themeToggle.addEventListener("click", () => {
      const dark = root.dataset.theme !== "dark";
      setTheme(dark);
      try {
        localStorage.setItem("dk-theme", dark ? "dark" : "light");
      } catch {}
    });
  }
})();
(() => {
  const modal = document.getElementById("modal");
  const modalBody = document.getElementById("modal-body");
  if (!modal) return;
  document.body.addEventListener("htmx:afterSwap", (e) => {
    if (e.detail.target.id === "modal-body" && !modal.open) modal.showModal();
  });
  document.body.addEventListener("click", (e) => {
    if (e.target.closest("[data-modal-close]")) modal.close();
  });
  modal.addEventListener("cancel", (e) => e.preventDefault());
  modal.addEventListener("close", () => modalBody.replaceChildren());
})();
(() => {
  const tour = document.getElementById("product-tour");
  if (!tour) return;
  const stateKey = "dk-product-tour-step";
  const steps = [
    { path: "{{u "/"}}", target: "dashboard-summary", title: "Welcome to DumpKeeper", copy: "The Dashboard summarizes database health, backup activity, row trends, uptime, and recent executions." },
    { path: "{{u "/"}}", target: "nav-databases", title: "Start with a database", copy: "Databases contains the PostgreSQL connection profiles that backup jobs use.", next: "Open Databases" },
    { path: "{{u "/databases"}}", target: "new-database", title: "Add a database profile", copy: "This button opens the connection form. Enter an address reachable from the DumpKeeper container, save it, then use Ping to test it." },
    { path: "{{u "/databases"}}", target: "nav-destinations", title: "Optional S3 storage", copy: "Destinations lets you send additional copies to S3-compatible storage. Local storage is always available.", next: "Open Destinations" },
    { path: "{{u "/destinations"}}", target: "new-destination", title: "Add a destination", copy: "Use this button to configure an endpoint, access keys, bucket, and optional prefix. You can test the connection after saving." },
    { path: "{{u "/destinations"}}", target: "nav-jobs", title: "Create the backup workflow", copy: "Jobs connect a database with storage destinations, a schedule, and a retention limit.", next: "Open Jobs" },
    { path: "{{u "/jobs"}}", target: "new-job", title: "Add a backup job", copy: "Choose a database and destinations, then enter a five-field cron schedule. Leave the schedule empty for manual backups only." },
    { path: "{{u "/jobs"}}", target: "nav-executions", title: "Follow every backup", copy: "Executions records scheduled and manual runs, including their status, size, duration, and stored copies.", next: "Open Executions" },
    { path: "{{u "/executions"}}", target: "executions-list", title: "Execution history", copy: "Completed backups can be downloaded or restored here. Running restores also report their progress in this table." },
    { path: "{{u "/executions"}}", target: "nav-restore", title: "Restore an uploaded dump", copy: "Restore accepts a SQL dump and lets you choose the target database and safety options.", next: "Open Restore" },
    { path: "{{u "/restore"}}", target: "restore-page", title: "Restore carefully", copy: "A restore can replace existing data. Review the target database and options before selecting a dump and submitting the form." },
    { path: "{{u "/restore"}}", target: "guide-button", title: "You are ready", copy: "The tour never created or changed anything. Use the Guide button in the sidebar whenever you want to run it again.", next: "Finish" }
  ];
  const focus = tour.querySelector(".tour-focus");
  const guard = tour.querySelector(".tour-guard");
  const popover = tour.querySelector(".tour-popover");
  const title = tour.querySelector("[data-tour-title]");
  const copy = tour.querySelector("[data-tour-copy]");
  const progress = tour.querySelector("[data-tour-progress]");
  const prevBtn = tour.querySelector("[data-tour-prev]");
  const nextBtn = tour.querySelector("[data-tour-next]");
  let index = 0;
  let active = false;
  let previousFocus = null;

  const saveStep = (value) => {
    try { sessionStorage.setItem(stateKey, String(value)); } catch {}
  };
  const savedStep = () => {
    try {
      const value = sessionStorage.getItem(stateKey);
      if (value === null) return null;
      const parsed = Number.parseInt(value, 10);
      return Number.isInteger(parsed) && parsed >= 0 && parsed < steps.length ? parsed : null;
    } catch { return null; }
  };
  const clearStep = () => {
    try { sessionStorage.removeItem(stateKey); } catch {}
  };
  const dismiss = () => {
    const form = new FormData();
    form.set("csrf", tour.dataset.csrf);
    fetch(tour.dataset.dismissUrl, { method: "POST", body: form, keepalive: true }).catch(() => {});
  };
  const setMobileNavigation = (target) => {
    if (!matchMedia("(max-width: 760px)").matches) return;
    const open = Boolean(target.closest(".sidebar nav"));
    document.body.classList.toggle("mobile-nav-open", open);
    const toggle = document.querySelector(".mobile-nav-toggle");
    if (toggle) {
      toggle.setAttribute("aria-expanded", String(open));
      toggle.setAttribute("aria-label", open ? "Close navigation" : "Open navigation");
    }
  };
  const position = (target) => {
    if (!active) return;
    const pad = 6;
    const rect = target.getBoundingClientRect();
    const left = Math.max(4, rect.left - pad);
    const top = Math.max(4, rect.top - pad);
    const right = Math.min(innerWidth - 4, rect.right + pad);
    const bottom = Math.min(innerHeight - 4, rect.bottom + pad);
    for (const el of [focus, guard]) {
      el.style.left = `${left}px`;
      el.style.top = `${top}px`;
      el.style.width = `${Math.max(1, right - left)}px`;
      el.style.height = `${Math.max(1, bottom - top)}px`;
    }
    popover.style.visibility = "hidden";
    const width = popover.offsetWidth;
    const height = popover.offsetHeight;
    let popLeft = Math.min(Math.max(12, left), innerWidth - width - 12);
    let popTop = bottom + 14;
    if (popTop + height > innerHeight - 12) popTop = top - height - 14;
    if (popTop < 12) {
      popTop = Math.min(Math.max(12, top), innerHeight - height - 12);
      if (right + width + 14 <= innerWidth) popLeft = right + 14;
      else if (left - width - 14 >= 0) popLeft = left - width - 14;
    }
    popover.style.left = `${Math.max(12, popLeft)}px`;
    popover.style.top = `${Math.max(12, popTop)}px`;
    popover.style.visibility = "visible";
  };
  const render = () => {
    const step = steps[index];
    saveStep(index);
    if (location.pathname !== step.path) {
      location.assign(step.path);
      return;
    }
    let target = document.querySelector(`[data-tour="${step.target}"]`);
    if (!target) target = document.querySelector("main");
    setMobileNavigation(target);
    target.scrollIntoView({ block: "center", inline: "nearest" });
    title.textContent = step.title;
    copy.textContent = step.copy;
    progress.textContent = `Step ${index + 1} of ${steps.length}`;
    prevBtn.disabled = index === 0;
    nextBtn.textContent = step.next || (index === steps.length - 1 ? "Finish" : "Next ›");
    requestAnimationFrame(() => requestAnimationFrame(() => {
      position(target);
      nextBtn.focus();
    }));
  };
  const start = (step = 0) => {
    previousFocus = document.activeElement;
    index = step;
    active = true;
    tour.hidden = false;
    document.body.classList.add("tour-active");
    render();
  };
  const stop = () => {
    if (!active) return;
    active = false;
    clearStep();
    tour.hidden = true;
    document.body.classList.remove("tour-active", "mobile-nav-open");
    dismiss();
    previousFocus?.focus?.();
  };
  const move = (offset) => {
    const next = index + offset;
    if (next < 0) return;
    if (next >= steps.length) { stop(); return; }
    index = next;
    render();
  };

  prevBtn.addEventListener("click", () => move(-1));
  nextBtn.addEventListener("click", () => move(1));
  tour.querySelectorAll("[data-tour-stop]").forEach((button) => button.addEventListener("click", stop));
  document.body.addEventListener("click", (e) => {
    if (e.target.closest("[data-open-guide]")) {
      e.preventDefault();
      start(0);
    }
  });
  document.addEventListener("keydown", (e) => {
    if (!active) return;
    if (e.key === "Escape") { e.preventDefault(); stop(); }
    if (e.key === "ArrowRight") { e.preventDefault(); move(1); }
    if (e.key === "ArrowLeft") { e.preventDefault(); move(-1); }
    if (e.key === "Tab") {
      const controls = Array.from(popover.querySelectorAll("button:not(:disabled)"));
      const current = controls.indexOf(document.activeElement);
      if (e.shiftKey && current <= 0) { e.preventDefault(); controls.at(-1)?.focus(); }
      else if (!e.shiftKey && current === controls.length - 1) { e.preventDefault(); controls[0]?.focus(); }
    }
  });
  addEventListener("resize", () => { if (active) render(); });

  const saved = savedStep();
  if (saved !== null) start(saved);
  else if (tour.dataset.autoStart === "1") start(0);
})();
</script>{{end}}
</body>
</html>
