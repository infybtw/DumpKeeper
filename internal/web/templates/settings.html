{{define "content"}}
<div class="page-head">
  <h1>Settings</h1>
</div>
<form class="form" method="post" action="/settings">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <p class="hint">S3 destination used by jobs with “Store to S3” enabled. Works with any S3-compatible endpoint (AWS S3, MinIO, Cloudflare R2, …). Objects are stored as <code>{prefix}/{filename}</code>.</p>
  <div class="grid2">
    <label>Endpoint
      <input name="s3_endpoint" value="{{.Data.S.s3_endpoint}}" placeholder="s3.amazonaws.com">
    </label>
    <label>Region
      <input name="s3_region" value="{{.Data.S.s3_region}}" placeholder="us-east-1">
    </label>
  </div>
  <div class="grid2">
    <label>Bucket
      <input name="s3_bucket" value="{{.Data.S.s3_bucket}}" placeholder="dk-backups">
    </label>
    <label>Prefix
      <input name="s3_prefix" value="{{.Data.S.s3_prefix}}" placeholder="dumpkeeper">
    </label>
  </div>
  <div class="grid2">
    <label>Access key
      <input name="s3_access_key" value="{{.Data.S.s3_access_key}}">
    </label>
    <label>Secret key
      <input name="s3_secret_key" type="password" value="{{.Data.S.s3_secret_key}}">
    </label>
  </div>
  <label class="check">
    <input type="checkbox" name="s3_use_ssl" value="1" {{if eq .Data.S.s3_use_ssl "1"}}checked{{end}}> Use HTTPS
  </label>
  <div>
    <button class="btn btn-primary" type="submit">Save settings</button>
  </div>
</form>
{{end}}
