# Local development stack: DumpKeeper + a throwaway PostgreSQL to back up
# + MinIO for exercising S3 destinations.
#
#   docker compose up -d --build
#
#   UI:       http://127.0.0.1:18080  (admin / admin123)
#   Postgres: from the host      -> psql -h 127.0.0.1 -p 15432 -U postgres
#             in the UI job form -> host "postgres", port 5432
#   MinIO:    http://127.0.0.1:9000 (minio / minio12345), bucket dk-backups
#             destination endpoint from DumpKeeper: "minio:9000", HTTPS off
#
#   Seed test data:
#     docker compose exec postgres psql -U postgres -c \
#       'CREATE TABLE demo AS SELECT generate_series(1,10) i'
#
#   Teardown (keeps data volumes):
#     docker compose down

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: pgpass
    ports:
      - "127.0.0.1:15432:5432" # host access only; 5432 is taken on this machine
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    command: server /data
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 10

  minio-setup:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio minio12345 &&
      mc mb --ignore-existing local/dk-backups"

  dumpkeeper:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      AUTH_LOGIN: admin
      AUTH_PASSWORD: admin123
      BASE_PATH: /dk
    ports:
      - "127.0.0.1:18080:8080" # host 8080 is taken by another project
    volumes:
      - dkdata:/data

volumes:
  pgdata:
  miniodata:
  dkdata:
